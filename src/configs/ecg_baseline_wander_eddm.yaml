data_dir: "../data/ecg_baseline_wander"
root_dir: "../runs/ecg_baseline_wander"

checkpoint_dir: "${root_dir}/checkpoint"
results_dir: "${root_dir}/results"
log_dir: "${root_dir}/log"

exp_name: ptbxl_lead2_baseline_wander_eddm
model_name: eddm
seed: 42
log_tensorboard: True
log_config: False
log_model_architecture: False

training:
  # EDDM paper-faithful recipe (Li et al. 2025, Section IV-C2): RAdam
  # optimizer, initial lr=1e-5, batch_size=64. The paper gives no epoch /
  # iteration budget (only generic T/M in Algorithm 1) and says the LR "can
  # adaptively adjust" -- RAdam's warmup. A ReduceLROnPlateau schedule is
  # added on top so the fixed-LR diffusion training anneals to a tight
  # minimum; EarlyStopping uses each model's validation loss for the unified
  # benchmark, and the best-val-loss checkpoint is saved throughout.
  train_epochs: 50000
  batch_size: 64
  lr: 1.0e-5
  optimizer: RAdam
  betas: [0.9, 0.999]
  weight_decay: 0.0
  scheduler: ReduceLROnPlateau
  factor: 0.5
  lr_scheduler_patience_epochs: 5
  lr_scheduler_min_delta: 1.0e-4
  min_lr: 1.0e-7
  eval_every_epochs: 1
  validation_metrics_every_epochs: 1
  save_every_epochs: 50
  early_stopping_patience_epochs: 30
  early_stopping_min_delta: 1.0e-4
  selection_metric: val_loss
  progress_bar: True
  resume: False
  resume_checkpoint: null

evaluation:
  low_frequency_high_hz: 0.5

dataset:
  name: ecg_baseline_wander
  data_dir: "${data_dir}"
  train_dataset: ptbxl
  external_test_datasets:
    - mit_bih
    - chapman
    - cpsc
    - qtdb
  lead: II
  split:
    strategy: ptbxl_official_folds
    patient_wise: True
    train_folds: [1, 2, 3, 4, 5, 6, 7, 8]
    validation_fold: 9
    test_fold: 10
    ratio: [0.8, 0.1, 0.1]
  clean_reference:
    filter_type: butterworth
    filter_order: 4
    zero_phase: True
    bandpass_hz: [0.05, 40.0]
  resample_hz: 360
  window_size: 512
  overlap_ratio: 0.0
  normalization: endpoint_center
  baseline_wander:
    train_source: nstdb
    # DeepFilter (Romero et al. 2021) Data_Preparation noise scaling: the
    # NSTDB baseline segment is normalised by its own peak-to-peak range,
    # then scaled to delta * ptp(clean ECG) where delta = randint(20, 200) /
    # 100 per window (noise_sampling: deepfilter + integer_percent_uniform).
    # robustness_alpha_values is a separate discrete grid used only by
    # Experiment 2 (exp2-strength sweep), matching DeepFilter / MECG-E's
    # reported noise-amplitude bins.
    alpha_mode: peak_to_peak_ratio
    noise_sampling: deepfilter
    alpha_sampling: integer_percent_uniform
    alpha_values: [0.2, 2.0]
    robustness_alpha_values: [0.2, 0.6, 1.0, 1.5, 2.0]
    controlled_frequencies_hz: [0.05, 0.1, 0.2, 0.3, 0.5, 0.8, 1.0]
    test_types:
      - nstdb
      - sinusoidal
      - multi_sine
      - random_low_frequency_drift
  eps: 1.0e-10

model:
  # EDDM paper-faithful diffusion setup (Li et al. 2025, Section IV-C2):
  # T=50 diffusion steps ("consistent with [25]", i.e. DeScoD-ECG). The
  # reverse process always runs all T steps (Algorithm 2). num_shots=1 is
  # the paper's "EDDM-1" table entry; the paper also reports EDDM-3/5/10
  # (num_shots 3/5/10), the "EDDM-k" multifold ensemble.
  # alpha_t / beta_t use the paper's "linear decrease" schedule normalized
  # to sum(alpha_t)=1 (alpha_bar_T=1) and sum(beta_t^2)=1 (beta_bar_T=1, so
  # the diffusion endpoint is x_T = x_tilde + eps as stated in Section III-B).
  # gaussian_scale=1.0 keeps beta_bar_T=1 (paper-faithful).
  # base_channels / channel_mults / time_dim / pool_scales / attention_heads
  # are NOT specified in the paper (no public code) -- best-effort values.
  timesteps: 50
  num_shots: 1
  base_channels: 64
  channel_mults: [1, 2, 4, 8]
  time_dim: 256
  dropout: 0.0
  gaussian_scale: 1.0
  ecg_noise_weight: 1.0
  gaussian_noise_weight: 1.0
  pool_scales: [3, 5, 9, 15]
  attention_heads: 4
