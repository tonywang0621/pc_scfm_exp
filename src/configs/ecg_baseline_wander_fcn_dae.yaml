data_dir: "../data/ecg_baseline_wander"
root_dir: "../runs/ecg_baseline_wander"

checkpoint_dir: "${root_dir}/checkpoint"
results_dir: "${root_dir}/results"
log_dir: "${root_dir}/log"

exp_name: ptbxl_lead2_baseline_wander_fcn_dae
model_name: fcn_dae
seed: 42
log_tensorboard: True
log_config: False
log_model_architecture: False

training:
  # FCN-DAE paper-faithful recipe.
  # Chiang et al. 2019 (IEEE Access) pin only two training choices: the
  # Adam optimizer and the MSE loss ("We trained all models using Adam to
  # minimize the mean square error between the clean and denoised
  # waveforms"). They give no batch size / LR schedule / epoch budget, and
  # released no code. The concrete unspecified hyper-parameters therefore
  # follow the reproducing paper DeepFilter's released training code
  # (fperdigon/DeepFilter dl_pipeline.py, applied to every DL baseline
  # incl. FCN-DAE -- same as the drnn / deepfilter configs here): batch 128,
  # Adam lr 1e-3, ReduceLROnPlateau(factor 0.5, patience 2, min_lr 1e-10),
  # max 1e5 epochs, EarlyStopping patience 10. (DeepFilter's code trains
  # FCN-DAE with ssd_loss, but the ORIGINAL paper uses MSE, which is what
  # this baseline follows -- see model.loss_fn.)
  # Unified convergence-controlled benchmark: train_epochs is a large cap and
  # early stopping / checkpoint selection use each model's validation loss while optimizer,
  # LR, batch size, and ReduceLROnPlateau remain aligned with the reproduction
  # recipe.
  train_epochs: 50000
  batch_size: 128
  lr: 1.0e-3
  optimizer: Adam
  betas: [0.9, 0.999]
  weight_decay: 0.0
  scheduler: ReduceLROnPlateau
  factor: 0.5
  lr_scheduler_patience_epochs: 2
  lr_scheduler_min_delta: 1.0e-4
  min_lr: 1.0e-10
  grad_clip_norm: null  # official FCN-DAE / DeepFilter (Keras) does not clip gradients
  eval_every_epochs: 1
  validation_metrics_every_epochs: 1
  save_every_epochs: 50
  early_stopping_patience_epochs: 30
  early_stopping_min_delta: 1.0e-4
  selection_metric: val_loss
  progress_bar: True
  resume: False
  resume_checkpoint: null

evaluation:
  low_frequency_high_hz: 0.5

dataset:
  name: ecg_baseline_wander
  data_dir: "${data_dir}"
  train_dataset: ptbxl
  external_test_datasets:
    - mit_bih
    - cpsc
    - chapman
    - qtdb
  lead: II
  split:
    strategy: ptbxl_official_folds
    patient_wise: True
    train_folds: [1, 2, 3, 4, 5, 6, 7, 8]
    validation_fold: 9
    test_fold: 10
    ratio: [0.8, 0.1, 0.1]
  clean_reference:
    filter_type: butterworth
    filter_order: 4
    zero_phase: True
    bandpass_hz: [0.05, 40.0]
  resample_hz: 360
  # 512-sample windows + endpoint-centering: the shared BW-removal benchmark
  # condition, so FCN-DAE's SSD / MAD / PRD / CosSim are directly comparable
  # with the other baselines (this is also exactly how DeepFilter / MECG-E /
  # DeScoD / EDDM benchmark FCN-DAE in their own tables). Chiang et al. 2019
  # use 1024 + per-window min-max [0,1]; the FCN is length-agnostic and its
  # batch norm makes it input-scale-invariant, so at 512 the only change is a
  # 16-dim bottleneck instead of the paper's 32 (the 32x compression ratio is
  # unchanged) -- negligible for a low-frequency BW-removal task.
  window_size: 512
  overlap_ratio: 0.0
  normalization: endpoint_center
  baseline_wander:
    train_source: nstdb
    # DeepFilter (Romero et al. 2021) Data_Preparation noise scaling: the
    # NSTDB baseline segment is normalised by its own peak-to-peak range,
    # then scaled to delta * ptp(clean ECG) where delta = randint(20, 200) /
    # 100 per window (noise_sampling: deepfilter + integer_percent_uniform).
    # robustness_alpha_values is a separate discrete grid used only by
    # Experiment 2 (exp2-strength sweep), matching DeepFilter / MECG-E's
    # reported noise-amplitude bins.
    alpha_mode: peak_to_peak_ratio
    noise_sampling: deepfilter
    alpha_sampling: integer_percent_uniform
    alpha_values: [0.2, 2.0]
    robustness_alpha_values: [0.2, 0.6, 1.0, 1.5, 2.0]
    controlled_frequencies_hz: [0.05, 0.1, 0.2, 0.3, 0.5, 0.8, 1.0]
    test_types:
      - nstdb
      - sinusoidal
      - multi_sine
      - random_low_frequency_drift
  eps: 1.0e-10

model:
  # Chiang et al. 2019 Fig. 2 / Section III: 6-layer encoder + 7-layer
  # decoder, all kernel size 16, ELU on every hidden layer, batch norm on
  # every hidden layer, no activation and no batch norm on the output
  # layer, no dropout (dropout in the paper is used only by the DNN/CNN
  # baselines). Encoder 40->20->20->20->40->1 with stride 2 downsampling
  # (stride 1 on the last, bottleneck, layer); decoder inversely symmetric.
  # Paper-faithful loss is MSE (Section IV-C); DeepFilter (Romero et al.
  # 2021) also confirms "[Chiang] used the MSE as a loss function".
  # Architecture, activations, batch norm, init, loss and optimiser match
  # the paper. Task-defined / benchmark differences: training data is PTB-XL
  # Lead II (paper: MIT-BIH -- external test here), the noise is baseline
  # wander only from NSTDB (paper: combined BW+MA+EM at fixed input SNRs),
  # and window / normalisation follow the shared 512 + endpoint-center
  # benchmark rather than the paper's 1024 + min-max [0,1] (see dataset).
  input_channels: 1
  kernel_size: 16
  encoder_channels: [40, 20, 20, 20, 40, 1]
  encoder_strides: [2, 2, 2, 2, 2, 1]
  decoder_channels: [1, 40, 20, 20, 20, 40, 1]
  decoder_strides: [1, 2, 2, 2, 2, 2, 1]
  loss_fn: "mse"
