data_dir: "../data/ecg_baseline_wander"
root_dir: "../runs/ecg_baseline_wander"

checkpoint_dir: "${root_dir}/checkpoint"
results_dir: "${root_dir}/results"
log_dir: "${root_dir}/log"

exp_name: ptbxl_lead2_baseline_wander_fir_filter
model_name: fir_filter
seed: 42
log_tensorboard: True
log_config: False
log_model_architecture: False

training:
  train_epochs: 50000
  batch_size: 96
  lr: 1.0e-4
  optimizer: AdamW
  betas: [0.8, 0.99]
  scheduler: ExponentialLR
  gamma: 0.99
  eval_every_epochs: 1
  validation_metrics_every_epochs: 1
  save_every_epochs: 5
  early_stopping_patience_epochs: 30
  early_stopping_min_delta: 1.0e-4
  selection_metric: val_loss
  progress_bar: True
  resume: False
  resume_checkpoint: null

evaluation:
  low_frequency_high_hz: 0.5

dataset:
  name: ecg_baseline_wander
  data_dir: "${data_dir}"
  train_dataset: ptbxl
  external_test_datasets:
    - mit_bih
    - chapman
    - cpsc
    - qtdb
  lead: II
  split:
    strategy: ptbxl_official_folds
    patient_wise: True
    train_folds: [1, 2, 3, 4, 5, 6, 7, 8]
    validation_fold: 9
    test_fold: 10
    ratio: [0.8, 0.1, 0.1]
  clean_reference:
    filter_type: butterworth
    filter_order: 4
    zero_phase: True
    bandpass_hz: [0.05, 40.0]
  resample_hz: 360
  window_size: 512
  overlap_ratio: 0.0
  normalization: endpoint_center
  baseline_wander:
    train_source: nstdb
    # DeepFilter (Romero et al. 2021) Data_Preparation noise scaling: the
    # NSTDB baseline segment is normalised by its own peak-to-peak range,
    # then scaled to delta * ptp(clean ECG) where delta = randint(20, 200) /
    # 100 per window (noise_sampling: deepfilter + integer_percent_uniform).
    # robustness_alpha_values is a separate discrete grid used only by
    # Experiment 2 (exp2-strength sweep), matching DeepFilter / MECG-E's
    # reported noise-amplitude bins.
    alpha_mode: peak_to_peak_ratio
    noise_sampling: deepfilter
    alpha_sampling: integer_percent_uniform
    alpha_values: [0.2, 2.0]
    robustness_alpha_values: [0.2, 0.6, 1.0, 1.5, 2.0]
    controlled_frequencies_hz: [0.05, 0.1, 0.2, 0.3, 0.5, 0.8, 1.0]
    test_types:
      - nstdb
      - sinusoidal
      - multi_sine
      - random_low_frequency_drift
  eps: 1.0e-10

model:
  sampling_rate: 360
  # FIR baseline = the official DeepFilter FIR (Romero et al. 2021 Sec. 5.2 /
  # fperdigon/DeepFilter digitalFilters/dfilters.py FIRRemoveBL). DeepFilter
  # runs kaiserord(ripple_db = (round(-20*log10(0.001)) + 1) / 2 = 30.5 dB,
  # width = 0.07 Hz / nyquist) and reports the resulting design as "order of
  # 8079 and a beta of 2.18". We pin those directly (fixed_order) so the tap
  # count matches the paper exactly -- scipy's current kaiserord halves the
  # transition width internally and would return ~16150 taps instead.
  # kaiser_beta = kaiser_beta(30.5 dB) = 2.187. Cutoff 0.67 Hz (AHA
  # high-pass). Applied to each 512-sample window with DeepFilter's
  # short-signal trick (mirror the window, tail-pad with the last sample,
  # filtfilt, take the central segment), then the FIRRemoveHF 150 Hz
  # low-pass stage.
  filter_kind: fir
  cutoff_hz: 0.67
  fir_design: fixed_order
  fir_order: 8078            # numtaps = fir_order + 1 = 8079 (paper's order)
  fir_window: kaiser
  kaiser_beta: 2.187         # kaiser_beta(30.5 dB); paper rounds to 2.18
  kaiser_factor: 2.0         # documents the ripple_db divisor (unused in fixed_order)
  transition_width_hz: 0.07  # documents the kaiserord width (unused in fixed_order)
  zero_phase: True
  allow_causal_fallback: False
  short_signal_mode: deepfilter_pad
  post_lowpass_hz: 150.0
