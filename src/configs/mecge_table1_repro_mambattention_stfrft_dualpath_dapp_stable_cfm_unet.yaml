data_dir: "../data/mecge_table1_repro"
root_dir: "../runs/mecge_table1_repro/mambattention_stfrft_dualpath_dapp_stable_cfm_unet"

checkpoint_dir: "${root_dir}/checkpoint"
results_dir: "${root_dir}/results"
log_dir: "${root_dir}/log"

exp_name: mambattention_stfrft_dualpath_dapp_stable_cfm_unet__qtdb_train_qtdb_test__nv1__seed42
model_name: mambattention_stfrft_dualpath_dapp_stable_cfm_unet_ecg
seed: 42
log_tensorboard: True
log_config: False
log_model_architecture: False

training:
  train_epochs: 50000
  batch_size: 64
  lr: 1.0e-5
  optimizer: AdamW
  betas: [0.8, 0.99]
  weight_decay: 1.0e-4
  scheduler: ReduceLROnPlateau
  factor: 0.5
  lr_scheduler_patience_epochs: 5
  lr_scheduler_min_delta: 1.0e-4
  min_lr: 1.0e-7
  grad_clip_norm: 0.10
  eval_every_epochs: 1
  validation_metrics_every_epochs: 1
  save_every_epochs: 5
  early_stopping_patience_epochs: 30
  early_stopping_min_delta: 1.0e-4
  selection_metric: val_loss
  progress_bar: True
  resume: False
  resume_checkpoint: null
  init_checkpoint: null

evaluation:
  low_frequency_high_hz: 0.5

dataset:
  name: ecg_baseline_wander
  data_dir: "${data_dir}"
  pkl_file: "${data_dir}/raw/dataset_bw_nv1.pkl"
  pkl_validation_ratio: 0.3
  pkl_validation_random_state: 1
  train_dataset: qtdb
  external_test_datasets: []
  test_label: qtdb_pkl_test
  lead: single
  split:
    strategy: mecge_official_pkl
    patient_wise: false
    ratio: [0.7, 0.3, 0.0]
  resample_hz: 360
  window_size: 512
  overlap_ratio: 0.0
  normalization: mecge_official_pkl
  baseline_wander:
    train_source: mecge_official_pkl
    alpha_mode: peak_to_peak_ratio
    noise_sampling: deepfilter
    alpha_sampling: integer_percent_uniform
    alpha_values: [0.2, 2.0]
    robustness_alpha_values: [0.2, 0.6, 1.0, 1.5, 2.0]
    test_types:
      - nstdb
  eps: 1.0e-10

model:
  fea: "pha"
  norm: False
  dense_channel: 64
  compress_factor: 0.3
  num_tscblocks: 4
  d_state: 16
  d_conv: 4
  expand: 4
  norm_epsilon: 1.0e-5
  attention_heads: 8
  attention_dropout: 0.0
  attention_position: "before_mamba"
  use_time_attention: true
  use_freq_attention: true
  time_frequency_transform: "stfrft"
  learnable_frft_order: true
  frft_order_init: 0.9
  frft_order_min: 0.05
  frft_order_max: 1.95
  use_dapp: true
  dapp_time_scales: [3, 5, 9, 15]
  dapp_freq_scales: [1, 3]
  dual_noise_head_hidden: 64
  residual_refine_scale: 0.15
  baseline_kernel_size: 129
  sampling_rate: 360
  n_fft: 64
  hop_size: 8
  win_size: 64
  beta: 2
  loss_fn: "time+com+con+dual_noise+lf+morph+cfm+noise_aux"
  lambda_dual_baseline: 0.08
  lambda_dual_residual: 0.02
  lambda_lf: 0.04
  lambda_morph: 0.02
  cfm_channels: 64
  cfm_blocks: 4
  cfm_time_dim: 128
  cfm_groups: 8
  cfm_dropout: 0.0
  cfm_dilations: [1, 2, 4, 8]
  cfm_inference_steps: 1
  cfm_use_adaptive_gate: true
  cfm_gate_hidden: 64
  cfm_clean_delta_budget: 0.12
  cfm_baseline_delta_budget: 0.25
  cfm_project_baseline_delta: true
  cfm_clean_lowpass_keep: 0.15
  cfm_train_noise_scale: 0.01
  cfm_zero_start_prob: 0.85
  cfm_bridge_noise_scale: 0.0
  cfm_refine_gate_init: 0.015
  cfm_refine_gate_max: 0.06
  cfm_baseline_gate_init: 0.025
  cfm_baseline_gate_max: 0.10
  cfm_consistency_blend_init: 0.06
  cfm_consistency_blend_max: 0.20
  cfm_condition_clip: 8.0
  cfm_target_clip: 5.0
  cfm_velocity_clip: 3.0
  cfm_state_clip: 5.0
  cfm_aux_clip: 5.0
  cfm_loss_type: smooth_l1
  cfm_stft_configs:
    - [32, 4, 32]
    - [64, 8, 64]
  lambda_cfm: 0.015
  lambda_cfm_baseline: 0.02
  lambda_cfm_recon: 0.05
  lambda_cfm_stft: 0.005
  lambda_cfm_lf: 0.02
  lambda_cfm_deriv: 0.01
  lambda_cfm_residual_smooth: 0.02
  lambda_cfm_clean_baseline_consistency: 0.01
  cfm_unet_base_channels: 48
  cfm_unet_channel_mults: [1, 2, 2]
  cfm_unet_time_dim: 128
  cfm_unet_pool_scales: [3, 5, 9, 15]
  cfm_unet_attention_heads: 4
  cfm_unet_aux_channels: 2
  lambda_ecg_noise_aux: 0.01
  lambda_gaussian_noise_aux: 0.0
  gaussian_aux_scale: 0.1
