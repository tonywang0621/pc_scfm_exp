data_dir: "../data/ecg_baseline_wander"
root_dir: "../runs/ecg_baseline_wander"

checkpoint_dir: "${root_dir}/checkpoint"
results_dir: "${root_dir}/results"
log_dir: "${root_dir}/log"

exp_name: ptbxl_lead2_baseline_wander_mambattention_stfrft_dualpath_dapp_cfm_unet_bd
model_name: mambattention_stfrft_dualpath_dapp_cfm_unet_bd_ecg
seed: 42
log_tensorboard: True
log_config: False
log_model_architecture: False

training:
  # Proposed method -- recipe tuned for full convergence (notes/experiment_
  # 實驗設計.txt allows the proposed model its own recipe, as long as the
  # validation fold and selection rule stay the same as the baselines: this
  # uses only PTB-XL fold 9, selection_metric val_prd, best checkpoint saved
  # throughout).
  # ExponentialLR(0.99) would crush the LR to ~1e-6 by epoch ~400, which
  # undertrains a model with a CFM flow-matching head + auxiliary U-Net + a
  # 9-term loss. ReduceLROnPlateau instead anneals only when validation
  # stalls, so training runs until it genuinely stops improving; the very
  # patient EarlyStopping (patience 20, min_delta 1e-4 on val PRD) ensures
  # it never stops short of the optimum. train_epochs is an effectively
  # unlimited cap.
  train_epochs: 50000
  batch_size: 96
  lr: 1.0e-4
  optimizer: AdamW
  betas: [0.8, 0.99]
  scheduler: ReduceLROnPlateau
  factor: 0.5
  lr_scheduler_patience_epochs: 5
  lr_scheduler_min_delta: 1.0e-4
  min_lr: 1.0e-7
  grad_clip_norm: 1.0
  eval_every_epochs: 1
  validation_metrics_every_epochs: 1
  save_every_epochs: 5
  early_stopping_patience_epochs: 20
  early_stopping_min_delta: 1.0e-4
  selection_metric: val_prd
  progress_bar: True
  resume: False
  resume_checkpoint: null
  init_checkpoint: null

evaluation:
  low_frequency_high_hz: 0.5

dataset:
  name: ecg_baseline_wander
  data_dir: "${data_dir}"
  # Preprocessing is IDENTICAL to the 8 baseline configs (deepfilter, drnn,
  # fcn_dae, descod_ecg_1shot, eddm, mecg_e, fir_filter, iir_filter) so this
  # model's SSD / MAD / PRD / CosSim are directly comparable with them:
  # 360 Hz resample, 512-sample non-overlapping windows, endpoint-centering,
  # Butterworth-4 zero-phase 0.05-40 Hz clean reference, NSTDB baseline
  # wander scaled by an integer-percent peak-to-peak ratio in [0.2, 2.0]
  # (DeepFilter's Data_Preparation: randint(20, 200) / 100).
  train_dataset: ptbxl
  external_test_datasets:
    - mit_bih
    - chapman
    - cpsc
    - qtdb
  lead: II
  split:
    strategy: ptbxl_official_folds
    patient_wise: True
    train_folds: [1, 2, 3, 4, 5, 6, 7, 8]
    validation_fold: 9
    test_fold: 10
    ratio: [0.8, 0.1, 0.1]
  clean_reference:
    filter_type: butterworth
    filter_order: 4
    zero_phase: True
    bandpass_hz: [0.05, 40.0]
  resample_hz: 360
  window_size: 512
  overlap_ratio: 0.0
  normalization: endpoint_center
  baseline_wander:
    train_source: nstdb
    alpha_mode: peak_to_peak_ratio
    noise_sampling: deepfilter
    alpha_sampling: integer_percent_uniform
    alpha_values: [0.2, 2.0]
    robustness_alpha_values: [0.2, 0.6, 1.0, 1.5, 2.0]
    controlled_frequencies_hz: [0.05, 0.1, 0.2, 0.3, 0.5, 0.8, 1.0]
    test_types:
      - nstdb
      - sinusoidal
      - multi_sine
      - random_low_frequency_drift
  eps: 1.0e-10

model:
  fea: "pha"
  norm: False
  dense_channel: 64
  compress_factor: 0.3
  num_tscblocks: 4
  d_state: 16
  d_conv: 4
  expand: 4
  norm_epsilon: 1.0e-5
  attention_heads: 8
  attention_dropout: 0.0
  attention_position: "before_mamba"
  use_time_attention: true
  use_freq_attention: true
  time_frequency_transform: "stfrft"
  learnable_frft_order: true
  frft_order_init: 0.9
  frft_order_min: 0.05
  frft_order_max: 1.95
  use_dapp: true
  dapp_time_scales: [3, 5, 9, 15]
  dapp_freq_scales: [1, 3]
  dual_noise_head_hidden: 64
  residual_refine_scale: 0.5
  baseline_kernel_size: 129
  sampling_rate: 360
  n_fft: 64
  hop_size: 8
  win_size: 64
  beta: 2
  loss_fn: "time+mse+com+con+dual_noise+lf+morph+cfm+noise_aux"
  lambda_mse: 0.45
  lambda_dual_baseline: 0.30
  lambda_dual_residual: 0.06
  lambda_lf: 0.05
  lambda_morph: 0.08
  cfm_channels: 64
  cfm_blocks: 6
  cfm_time_dim: 128
  cfm_groups: 8
  cfm_dropout: 0.0
  cfm_dilations: [1, 2, 4, 8]
  cfm_inference_steps: 3
  cfm_use_adaptive_gate: true
  cfm_gate_hidden: 64
  cfm_clean_delta_budget: 0.30
  cfm_baseline_delta_budget: 1.20
  cfm_project_baseline_delta: true
  cfm_clean_lowpass_keep: 0.25
  cfm_train_noise_scale: 0.05
  cfm_zero_start_prob: 0.5
  cfm_bridge_noise_scale: 0.02
  cfm_refine_gate_init: 0.08
  cfm_refine_gate_max: 0.30
  cfm_baseline_gate_init: 0.22
  cfm_baseline_gate_max: 0.85
  cfm_consistency_blend_init: 0.30
  cfm_consistency_blend_max: 0.65
  cfm_stft_configs:
    - [32, 4, 32]
    - [64, 8, 64]
    - [128, 16, 128]
  lambda_cfm: 0.10
  lambda_cfm_baseline: 0.40
  lambda_cfm_recon: 0.30
  lambda_cfm_stft: 0.03
  lambda_cfm_lf: 0.05
  lambda_cfm_deriv: 0.07
  lambda_cfm_residual_smooth: 0.015
  lambda_cfm_clean_baseline_consistency: 0.10
  cfm_unet_base_channels: 64
  cfm_unet_channel_mults: [1, 2, 4]
  cfm_unet_time_dim: 192
  cfm_unet_pool_scales: [3, 5, 9, 15]
  cfm_unet_attention_heads: 4
  cfm_unet_aux_channels: 2
  lambda_ecg_noise_aux: 0.35
  lambda_gaussian_noise_aux: 0.10
  gaussian_aux_scale: 0.2
