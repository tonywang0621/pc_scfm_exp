data_dir: "../data/ecg_baseline_wander"
root_dir: "../runs/ecg_baseline_wander"

checkpoint_dir: "${root_dir}/checkpoint"
results_dir: "${root_dir}/results"
log_dir: "${root_dir}/log"

exp_name: ptbxl_lead2_baseline_wander_iir_filter
model_name: iir_filter
seed: 42
log_tensorboard: True
log_config: False
log_model_architecture: False

training:
  train_epochs: 50000
  batch_size: 96
  lr: 1.0e-4
  optimizer: AdamW
  betas: [0.8, 0.99]
  scheduler: ExponentialLR
  gamma: 0.99
  eval_every_epochs: 1
  validation_metrics_every_epochs: 1
  save_every_epochs: 5
  early_stopping_patience_epochs: 15
  early_stopping_min_delta: 1.0e-4
  progress_bar: True
  resume: False
  resume_checkpoint: null

evaluation:
  low_frequency_high_hz: 0.5

dataset:
  name: ecg_baseline_wander
  data_dir: "${data_dir}"
  train_dataset: ptbxl
  external_test_datasets:
    - mit_bih
    - chapman
    - cpsc
    - qtdb
  lead: II
  split:
    strategy: ptbxl_official_folds
    patient_wise: True
    train_folds: [1, 2, 3, 4, 5, 6, 7, 8]
    validation_fold: 9
    test_fold: 10
    ratio: [0.8, 0.1, 0.1]
  clean_reference:
    filter_type: butterworth
    filter_order: 4
    zero_phase: True
    bandpass_hz: [0.05, 40.0]
  resample_hz: 250
  window_size: 512
  overlap_ratio: 0.0
  normalization: z_score
  baseline_wander:
    train_source: nstdb
    # MECG-E (Hung et al. 2024) / DeepFilter (Romero et al. 2021) noise
    # scaling: delta ~ Uniform(0.2, 2.0) drawn continuously per sample (see
    # preprocess_ecg.py contaminate()), scaling the noise (normalized by its
    # own peak-to-peak range) to `delta` times the clean ECG's peak-to-peak
    # range. robustness_alpha_values is a separate, discrete grid used only
    # by Experiment 2 (exp2-strength sweep controlled conditions), matching
    # DeepFilter/MECG-E's reported noise-amplitude bins (Table III-VI).
    alpha_mode: peak_to_peak_ratio
    alpha_sampling: uniform_range
    alpha_values: [0.2, 2.0]
    robustness_alpha_values: [0.2, 0.6, 1.0, 1.5, 2.0]
    controlled_frequencies_hz: [0.05, 0.1, 0.2, 0.3, 0.5, 0.8, 1.0]
    test_types:
      - nstdb
      - sinusoidal
      - multi_sine
      - random_low_frequency_drift
  eps: 1.0e-10

model:
  fea: "pha"
  norm: False
  dense_channel: 64
  compress_factor: 0.3
  num_tscblocks: 4
  d_state: 16
  d_conv: 4
  expand: 4
  norm_epsilon: 1.0e-5
  sampling_rate: 250
  n_fft: 64
  hop_size: 8
  win_size: 64
  beta: 2
  # IIR paper-faithful design: aligned to the DeepFilter paper's (Romero
  # et al. 2021, Section 5.2) IIR baseline -- order=4, Butterworth,
  # bi-directional (zero-phase), cutoff 0.67 Hz (same AHA-recommended
  # high-pass cutoff used for its FIR baseline; the paper does not
  # re-state the cutoff in the IIR paragraph, this is inferred from "both
  # filters" sharing the design). This order is small enough that
  # filtfilt's padlen (~12 samples) fits comfortably within this
  # project's dataset.window_size=512, so zero_phase=True actually takes
  # effect here (unlike the FIR baseline's order=8079 -- see
  # ecg_baseline_wander_fir_filter.yaml for that unresolved caveat).
  filter_kind: iir
  cutoff_hz: 0.67
  iir_order: 4
  iir_method: butterworth
  zero_phase: True
