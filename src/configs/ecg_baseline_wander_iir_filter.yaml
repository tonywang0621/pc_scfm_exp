data_dir: "../data/ecg_baseline_wander"
root_dir: "../runs/ecg_baseline_wander"

checkpoint_dir: "${root_dir}/checkpoint"
results_dir: "${root_dir}/results"
log_dir: "${root_dir}/log"

exp_name: ptbxl_lead2_baseline_wander_iir_filter
model_name: iir_filter
seed: 42
log_tensorboard: True
log_config: False
log_model_architecture: False

training:
  train_epochs: 50000
  batch_size: 96
  lr: 1.0e-4
  optimizer: AdamW
  betas: [0.8, 0.99]
  scheduler: ExponentialLR
  gamma: 0.99
  eval_every_epochs: 1
  validation_metrics_every_epochs: 1
  save_every_epochs: 5
  early_stopping_patience_epochs: 20
  early_stopping_min_delta: 1.0e-4
  progress_bar: True
  resume: False
  resume_checkpoint: null

evaluation:
  low_frequency_high_hz: 0.5

dataset:
  name: ecg_baseline_wander
  data_dir: "${data_dir}"
  train_dataset: ptbxl
  external_test_datasets:
    - mit_bih
    - chapman
    - cpsc
    - qtdb
  lead: II
  split:
    strategy: ptbxl_official_folds
    patient_wise: True
    train_folds: [1, 2, 3, 4, 5, 6, 7, 8]
    validation_fold: 9
    test_fold: 10
    ratio: [0.8, 0.1, 0.1]
  clean_reference:
    filter_type: butterworth
    filter_order: 4
    zero_phase: True
    bandpass_hz: [0.05, 40.0]
  resample_hz: 360
  window_size: 512
  overlap_ratio: 0.0
  normalization: endpoint_center
  baseline_wander:
    train_source: nstdb
    # DeepFilter (Romero et al. 2021) Data_Preparation noise scaling: the
    # NSTDB baseline segment is normalised by its own peak-to-peak range,
    # then scaled to delta * ptp(clean ECG) where delta = randint(20, 200) /
    # 100 per window (noise_sampling: deepfilter + integer_percent_uniform).
    # robustness_alpha_values is a separate discrete grid used only by
    # Experiment 2 (exp2-strength sweep), matching DeepFilter / MECG-E's
    # reported noise-amplitude bins.
    alpha_mode: peak_to_peak_ratio
    noise_sampling: deepfilter
    alpha_sampling: integer_percent_uniform
    alpha_values: [0.2, 2.0]
    robustness_alpha_values: [0.2, 0.6, 1.0, 1.5, 2.0]
    controlled_frequencies_hz: [0.05, 0.1, 0.2, 0.3, 0.5, 0.8, 1.0]
    test_types:
      - nstdb
      - sinusoidal
      - multi_sine
      - random_low_frequency_drift
  eps: 1.0e-10

model:
  sampling_rate: 360
  # IIR baseline = the official DeepFilter IIR (Romero et al. 2021 Sec. 5.2 /
  # fperdigon/DeepFilter digitalFilters/dfilters.py IIRRemoveBL): order-4
  # Butterworth high-pass, bi-directional / zero-phase, cutoff 0.67 Hz (AHA;
  # "both filters" share the FIR baseline's cutoff), then an IIRRemoveHF
  # 150 Hz low-pass stage. filtfilt's padlen (~12) fits well within the 512
  # window, so no short-signal padding is triggered here.
  # Implementation nuance vs DeepFilter: DeepFilter runs filtfilt(b, a) on
  # transfer-function coefficients; this port designs the same order-4
  # Butterworth as SOS and runs sosfiltfilt -- numerically identical to ~1e-7
  # at this order, and more stable.
  filter_kind: iir
  cutoff_hz: 0.67
  iir_order: 4
  iir_method: butterworth
  zero_phase: True
  allow_causal_fallback: False
  short_signal_mode: deepfilter_pad
  post_lowpass_hz: 150.0
