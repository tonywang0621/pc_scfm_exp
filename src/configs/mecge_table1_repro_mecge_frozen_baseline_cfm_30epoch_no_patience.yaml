data_dir: "../data/mecge_table1_repro"
root_dir: "../runs/mecge_table1_repro/mecge_frozen_baseline_cfm_30epoch_no_patience"

checkpoint_dir: "${root_dir}/checkpoint"
results_dir: "${root_dir}/results"
log_dir: "${root_dir}/log"

exp_name: mecge_frozen_baseline_cfm_30epoch_no_patience__qtdb_train_qtdb_test__nv1__seed42
model_name: mecge_frozen_baseline_cfm_ecg
seed: 42
log_tensorboard: True
log_config: False
log_model_architecture: False

training:
  train_epochs: 30
  batch_size: 64
  lr: 2.0e-5
  optimizer: AdamW
  betas: [0.8, 0.99]
  weight_decay: 1.0e-2
  scheduler: ReduceLROnPlateau
  factor: 0.5
  lr_scheduler_patience_epochs: 5
  lr_scheduler_min_delta: 1.0e-4
  min_lr: 1.0e-7
  grad_clip_norm: 0.5
  eval_every_epochs: 1
  validation_metrics_every_epochs: 1
  save_every_epochs: 5
  early_stopping_patience_epochs: 0
  early_stopping_min_delta: 1.0e-4
  selection_metric: val_loss
  progress_bar: True
  resume: False
  resume_checkpoint: null

evaluation:
  low_frequency_high_hz: 0.5

dataset:
  name: ecg_baseline_wander
  data_dir: "${data_dir}"
  pkl_file: "${data_dir}/raw/dataset_bw_nv1.pkl"
  pkl_validation_ratio: 0.3
  pkl_validation_random_state: 1
  train_dataset: qtdb
  external_test_datasets: []
  test_label: qtdb_pkl_test
  lead: single
  split:
    strategy: mecge_official_pkl
    patient_wise: false
    ratio: [0.7, 0.3, 0.0]
  resample_hz: 360
  window_size: 512
  overlap_ratio: 0.0
  normalization: mecge_official_pkl
  baseline_wander:
    train_source: mecge_official_pkl
    alpha_mode: peak_to_peak_ratio
    noise_sampling: deepfilter
    alpha_sampling: integer_percent_uniform
    alpha_values: [0.2, 2.0]
    robustness_alpha_values: [0.2, 0.6, 1.0, 1.5, 2.0]
    test_types:
      - nstdb
  eps: 1.0e-10

model:
  mecge_checkpoint: null
  require_mecge_checkpoint: true
  fea: "pha"
  norm: False
  fmamba: True
  dense_channel: 32
  compress_factor: 0.3
  num_tscblocks: 4
  d_state: 16
  d_conv: 4
  expand: 4
  norm_epsilon: 1.0e-5
  sampling_rate: 360
  n_fft: 64
  hop_size: 8
  win_size: 64
  beta: 2
  loss_fn: "flow_matching"
  cfm_condition_mode: "noisy_base_residual"
  cfm_loss_type: "smooth_l1"
  cfm_channels: 32
  cfm_blocks: 6
  cfm_time_dim: 96
  cfm_groups: 8
  cfm_dropout: 0.06
  cfm_dilations: [1, 2, 4, 8]
  cfm_inference_steps: 1
  cfm_train_noise_scale: 0.05
  cfm_zero_start_prob: 0.5
  cfm_bridge_noise_scale: 0.0
  cfm_inference_start_noise_scale: 0.0
  lambda_baseline_cfm: 1.0
  lambda_recon: 0.5
  baseline_cfm_gate_init: 0.05
  baseline_cfm_gate_max: 1.0
  cfm_project_baseline_delta: true
  cfm_baseline_delta_budget: 0.35
  output_blend: 1.0
