data_dir: "../data/ecg_baseline_wander"
root_dir: "../runs/ecg_baseline_wander"

checkpoint_dir: "${root_dir}/checkpoint"
results_dir: "${root_dir}/results"
log_dir: "${root_dir}/log"

exp_name: ptbxl_lead2_baseline_wander_mecg_e
model_name: mecg_e
seed: 42
log_tensorboard: True
log_config: False
log_model_architecture: False

training:
  # MECG-E paper-faithful recipe (Hung et al. 2024, Section IV-B / official
  # khhungg/MECG-E pipeline.py + config/MECGE_phase.yaml): AdamW(betas=[0.8,
  # 0.99]), lr=1e-4, ExponentialLR(gamma=0.99), batch_size=96. weight_decay
  # is not passed explicitly in the official optimizer call, which means it
  # falls back to AdamW's own default of 1e-2 -- matching the paper's stated
  # "weight decay was set to 1e-2", so we set it explicitly here (this
  # project's AdamW builder otherwise defaults to 0.0, unlike bare PyTorch).
  # train_epochs: the paper text says 40 epochs, and the official released
  # config/MECGE_phase.yaml actually trains for 30. train_epochs /
  # early_stopping_patience_epochs instead use this project's unified
  # cross-baseline training budget (50000 / 15, validation-PCC-driven) per
  # notes/experiment_實驗設計.txt.
  train_epochs: 50000
  batch_size: 96
  lr: 1.0e-4
  optimizer: AdamW
  betas: [0.8, 0.99]
  weight_decay: 1.0e-2
  scheduler: ExponentialLR
  gamma: 0.99
  eval_every_epochs: 1
  validation_metrics_every_epochs: 1
  save_every_epochs: 5
  early_stopping_patience_epochs: 15
  early_stopping_min_delta: 1.0e-4
  progress_bar: True
  resume: False
  resume_checkpoint: null

evaluation:
  low_frequency_high_hz: 0.5

dataset:
  name: ecg_baseline_wander
  data_dir: "${data_dir}"
  train_dataset: ptbxl
  external_test_datasets:
    - mit_bih
    - chapman
    - cpsc
    - qtdb
  lead: II
  split:
    strategy: ptbxl_official_folds
    patient_wise: True
    train_folds: [1, 2, 3, 4, 5, 6, 7, 8]
    validation_fold: 9
    test_fold: 10
    ratio: [0.8, 0.1, 0.1]
  clean_reference:
    filter_type: butterworth
    filter_order: 4
    zero_phase: True
    bandpass_hz: [0.05, 40.0]
  resample_hz: 250
  window_size: 512
  overlap_ratio: 0.0
  normalization: z_score
  baseline_wander:
    train_source: nstdb
    # MECG-E (Hung et al. 2024) / DeepFilter (Romero et al. 2021) noise
    # scaling: delta ~ Uniform(0.2, 2.0) drawn continuously per sample (see
    # preprocess_ecg.py contaminate()), scaling the noise (normalized by its
    # own peak-to-peak range) to `delta` times the clean ECG's peak-to-peak
    # range. robustness_alpha_values is a separate, discrete grid used only
    # by Experiment 2 (exp2-strength sweep controlled conditions), matching
    # DeepFilter/MECG-E's reported noise-amplitude bins (Table III-VI).
    alpha_mode: peak_to_peak_ratio
    alpha_sampling: uniform_range
    alpha_values: [0.2, 2.0]
    robustness_alpha_values: [0.2, 0.6, 1.0, 1.5, 2.0]
    controlled_frequencies_hz: [0.05, 0.1, 0.2, 0.3, 0.5, 0.8, 1.0]
    test_types:
      - nstdb
      - sinusoidal
      - multi_sine
      - random_low_frequency_drift
  eps: 1.0e-10

model:
  fea: "pha"
  norm: False
  fmamba: True
  dense_channel: 32
  compress_factor: 0.3
  num_tscblocks: 4
  d_state: 16
  d_conv: 4
  expand: 4
  norm_epsilon: 1.0e-5
  sampling_rate: 250
  n_fft: 64
  hop_size: 8
  win_size: 64
  beta: 2
  loss_fn: "time+com+con"
