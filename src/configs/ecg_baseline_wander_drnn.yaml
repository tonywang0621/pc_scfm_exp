data_dir: "../data/ecg_baseline_wander"
root_dir: "../runs/ecg_baseline_wander"

checkpoint_dir: "${root_dir}/checkpoint"
results_dir: "${root_dir}/results"
log_dir: "${root_dir}/log"

exp_name: ptbxl_lead2_baseline_wander_drnn
model_name: drnn
seed: 42
log_tensorboard: True
log_config: False
log_model_architecture: False

training:
  # DRNN paper-faithful recipe (Antczak 2018, Section 3.1): "stochastic
  # gradient descent with adaptive momentum (Adam)", "64 samples per-batch",
  # "loss metric was mean squared error", no LR schedule and no L2 / dropout
  # (Section 4 lists regularisation only as future work). Antczak gives no
  # learning rate (kept at 1e-3, the Keras Adam default) and his epoch counts
  # (20-50) were tied to a 2000-5000-sample dataset, so train_epochs /
  # early_stopping_patience use this project's unified cross-baseline budget.
  # Antczak's synthetic dynamical-model pretraining + real-data fine-tuning
  # (Sections 2.2 / 3.2) is NOT reproduced -- this is a DRNN architecture-only
  # baseline, per notes/experiment_實驗設計.txt.
  # Antczak specifies no LR schedule, but a fixed LR leaves an LSTM denoiser
  # oscillating around the optimum; ReduceLROnPlateau (the schedule the
  # DeepFilter DRNN reproduction also uses) is added so it anneals to a tight
  # minimum. Unified convergence-controlled benchmark selection uses
  # validation loss with the shared patience/min_delta policy.
  train_epochs: 50000
  batch_size: 64
  lr: 1.0e-3
  optimizer: Adam
  betas: [0.9, 0.999]
  weight_decay: 0.0
  scheduler: ReduceLROnPlateau
  factor: 0.5
  lr_scheduler_patience_epochs: 3
  lr_scheduler_min_delta: 1.0e-4
  min_lr: 1.0e-8
  grad_clip_norm: null  # Antczak / DeepFilter (Keras) DRNN does not clip gradients
  eval_every_epochs: 1
  validation_metrics_every_epochs: 1
  save_every_epochs: 50
  early_stopping_patience_epochs: 20
  early_stopping_min_delta: 1.0e-4
  selection_metric: val_loss
  progress_bar: True
  resume: False
  resume_checkpoint: null

evaluation:
  low_frequency_high_hz: 0.5

dataset:
  name: ecg_baseline_wander
  data_dir: "${data_dir}"
  train_dataset: ptbxl
  external_test_datasets:
    - mit_bih
    - cpsc
    - chapman
    - qtdb
  lead: II
  split:
    strategy: ptbxl_official_folds
    patient_wise: True
    train_folds: [1, 2, 3, 4, 5, 6, 7, 8]
    validation_fold: 9
    test_fold: 10
    ratio: [0.8, 0.1, 0.1]
  clean_reference:
    filter_type: butterworth
    filter_order: 4
    zero_phase: True
    bandpass_hz: [0.05, 40.0]
  resample_hz: 360
  window_size: 512
  overlap_ratio: 0.0
  normalization: endpoint_center
  baseline_wander:
    train_source: nstdb
    # DeepFilter (Romero et al. 2021) Data_Preparation noise scaling: the
    # NSTDB baseline segment is normalised by its own peak-to-peak range,
    # then scaled to delta * ptp(clean ECG) where delta = randint(20, 200) /
    # 100 per window (noise_sampling: deepfilter + integer_percent_uniform).
    # robustness_alpha_values is a separate discrete grid used only by
    # Experiment 2 (exp2-strength sweep), matching DeepFilter / MECG-E's
    # reported noise-amplitude bins.
    alpha_mode: peak_to_peak_ratio
    noise_sampling: deepfilter
    alpha_sampling: integer_percent_uniform
    alpha_values: [0.2, 2.0]
    robustness_alpha_values: [0.2, 0.6, 1.0, 1.5, 2.0]
    controlled_frequencies_hz: [0.05, 0.1, 0.2, 0.3, 0.5, 0.8, 1.0]
    test_types:
      - nstdb
      - sinusoidal
      - multi_sine
      - random_low_frequency_drift
  eps: 1.0e-10

model:
  # DRNN paper-faithful architecture (Antczak 2018, Fig. 5 / Section 3.1 best
  # network): single 64-unit LSTM layer + two 64-unit ReLU dense layers +
  # one linear output layer. See notes/experiment_實驗設計.txt "DRNN
  # architecture-only baseline" note for what is/isn't reproduced.
  input_size: 1
  lstm_hidden_sizes: [64]
  dense_layers: [64, 64]
  output_size: 1
  dropout: 0.0
  residual: False
  loss_fn: "mse"
