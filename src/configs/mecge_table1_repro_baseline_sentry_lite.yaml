data_dir: "../data/mecge_table1_repro"
root_dir: "../runs/mecge_table1_repro/baseline_sentry_lite"

checkpoint_dir: "${root_dir}/checkpoint"
results_dir: "${root_dir}/results"
log_dir: "${root_dir}/log"

exp_name: baseline_sentry_lite__qtdb_train_qtdb_test__nv1__seed42
model_name: baseline_sentry_lite
seed: 42
log_tensorboard: True
log_config: False
log_model_architecture: False

training:
  train_epochs: 50000
  batch_size: 64
  lr: 8.0e-5
  optimizer: AdamW
  betas: [0.8, 0.99]
  weight_decay: 1.0e-3
  scheduler: ReduceLROnPlateau
  factor: 0.5
  lr_scheduler_patience_epochs: 4
  lr_scheduler_min_delta: 1.0e-4
  min_lr: 1.0e-7
  grad_clip_norm: 0.5
  eval_every_epochs: 1
  validation_metrics_every_epochs: 1
  save_every_epochs: 5
  early_stopping_patience_epochs: 18
  early_stopping_min_delta: 1.0e-4
  selection_metric: val_loss
  progress_bar: True
  resume: False
  resume_checkpoint: null

evaluation:
  low_frequency_high_hz: 0.5

dataset:
  name: ecg_baseline_wander
  data_dir: "${data_dir}"
  pkl_file: "${data_dir}/raw/dataset_bw_nv1.pkl"
  pkl_validation_ratio: 0.3
  pkl_validation_random_state: 1
  train_dataset: qtdb
  external_test_datasets: []
  test_label: qtdb_pkl_test
  lead: single
  split:
    strategy: mecge_official_pkl
    patient_wise: false
    ratio: [0.7, 0.3, 0.0]
  resample_hz: 360
  window_size: 512
  overlap_ratio: 0.0
  normalization: mecge_official_pkl
  baseline_wander:
    train_source: mecge_official_pkl
    alpha_mode: peak_to_peak_ratio
    noise_sampling: deepfilter
    alpha_sampling: integer_percent_uniform
    alpha_values: [0.2, 2.0]
    robustness_alpha_values: [0.2, 0.6, 1.0, 1.5, 2.0]
    test_types:
      - nstdb
  eps: 1.0e-10

model:
  hidden_channels: 32
  conv_kernels: [7, 15, 31]
  ssm_layers: 2
  ssm_state_dim: 8
  ssm_kernel_size: 129
  attention_heads: 2
  attention_context: 64
  dropout: 0.05
  flow_enabled: false
  baseline_kernel_size: 129
  baseline_delta_budget: 0.0
  delta_gate_init: 0.0
  delta_gate_max: 0.0
  loss_fn: "time+baseline+lf+morph+smooth"
  lambda_baseline: 0.15
  lambda_lf: 0.08
  lambda_morph: 0.025
  lambda_smooth: 0.03
