data_dir: "../data/ecg_baseline_wander"
root_dir: "../runs/ecg_baseline_wander"

checkpoint_dir: "${root_dir}/checkpoint"
results_dir: "${root_dir}/results"
log_dir: "${root_dir}/log"

exp_name: ptbxl_lead2_baseline_wander_descod_ecg_1shot
model_name: descod_ecg_1shot
seed: 42
log_tensorboard: True
log_config: False
log_model_architecture: False

training:
  batch_size: 32
  train_iterations: 20000
  eval_every: 100
  validation_metrics_every: 500
  save_every: 5000
  lr: 1.0e-4
  early_stopping_patience: 25
  early_stopping_min_delta: 1.0e-4
  progress_bar: True
  resume: False
  resume_checkpoint: null

evaluation:
  low_frequency_high_hz: 0.5

dataset:
  name: ecg_baseline_wander
  data_dir: "${data_dir}"
  train_dataset: ptbxl
  external_test_datasets:
    - mit_bih
    - chapman
    - cpsc
  lead: II
  split:
    strategy: ptbxl_official_folds
    patient_wise: True
    train_folds: [1, 2, 3, 4, 5, 6, 7, 8]
    validation_fold: 9
    test_fold: 10
    ratio: [0.8, 0.1, 0.1]
  clean_reference:
    filter_type: butterworth
    filter_order: 4
    zero_phase: True
    bandpass_hz: [0.05, 40.0]
  resample_hz: 250
  window_size: 512
  overlap_ratio: 0.5
  normalization: z_score
  baseline_wander:
    train_source: nstdb
    alpha_mode: peak_to_peak_ratio
    alpha_values: [0.05, 0.1, 0.2, 0.3, 0.5]
    controlled_frequencies_hz: [0.05, 0.1, 0.2, 0.3, 0.5, 0.8, 1.0]
    test_types:
      - nstdb
      - sinusoidal
      - multi_sine
      - random_low_frequency_drift
  eps: 1.0e-10

model:
  feats: 80
  num_steps: 50
  beta_start: 1.0e-4
  beta_end: 0.5
  schedule: "quad"
  num_shots: 1
  clip_denoised: False
  loss_reduction: "sum"
  loss_fn: "noise_l1"
